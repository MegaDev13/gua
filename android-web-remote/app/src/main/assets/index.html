<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android Web Remote</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><strong>ANDROID WEB REMOTE</strong><span id="status">Desconectado</span></header><main><section class="screen"><img id="screen" draggable="false" alt="Tela do dispositivo"><p id="hint">Conecte e aprove a sessão no celular.</p></section><aside><h2>Sessão local</h2><p class="warning">Conexão sem criptografia. Use apenas em rede privada confiável.</p><form id="pair"><label>Código exibido no celular <input id="pin" inputmode="numeric" maxlength="8" required></label><button>Solicitar acesso</button></form><div class="buttons"><button data-action="back">Voltar</button><button data-action="home">Início</button><button data-action="recent">Recentes</button><button id="full">Tela cheia</button><button id="disconnect">Desconectar</button></div><label>Texto para campo selecionado<textarea id="text" placeholder="Digite o conteúdo completo"></textarea></label><button id="send">Definir texto no campo</button><p>Toque ou arraste sobre a imagem. Texto substitui o conteúdo do campo selecionado.</p></aside></main></body></html>
